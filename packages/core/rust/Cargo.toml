[package]
name = "kinetix_core"
version = "0.1.0"
edition = "2021"
description = "High-performance fitness computation core for KinetixFitt"
authors = ["KinetixFitt Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
num_cpus = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
