name: CI

# Gate anti-ruptura (V8 §80 + PARALLEL_PROTOCOL §4).
# Ningún PR a develop/main se fusiona en rojo.
# Árbol único: install en RAÍZ (workspaces), gates con -w apps/mobile.
# NOTA: no hay job de lint porque apps/mobile no tiene config de ESLint
# (Next 15 lo pediría interactivo). `next build` ya valida tipos+compilación.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (árbol único raíz)
        run: npm ci

      - name: Typecheck (0 errores)
        run: npm run typecheck -w apps/mobile

      - name: Migrate + seed (DB efímera de CI)
        env:
          DATABASE_URL: file:./dev.db
          JWT_SECRET: ci-only-insecure-32chars-minimum
        run: |
          npx prisma migrate deploy --schema apps/mobile/prisma/schema.prisma
          npm run db:seed -w apps/mobile

      - name: Tests
        env:
          DATABASE_URL: file:./dev.db
          JWT_SECRET: ci-only-insecure-32chars-minimum
        run: npm run test -w apps/mobile

      - name: Build
        env:
          DATABASE_URL: file:./dev.db
          JWT_SECRET: ci-only-insecure-32chars-minimum
        run: npm run build -w apps/mobile
