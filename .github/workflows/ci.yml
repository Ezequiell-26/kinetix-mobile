name: CI

# Gate anti-ruptura: ningún PR a develop/main se fusiona sin pasar typecheck,
# migraciones/seed, toda la suite de tests y build.
# Árbol único: install en RAÍZ (workspaces), gates con -w apps/mobile.
# DB de CI: Postgres efímero; el schema de producción es PostgreSQL.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-only-insecure-32chars-minimum

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (árbol único raíz)
        run: npm ci

      - name: Typecheck (0 errores)
        run: npm run typecheck -w apps/mobile

      - name: Migrate + seed (Postgres efímero de CI)
        run: |
          npx prisma migrate deploy --schema apps/mobile/prisma/schema.prisma
          npm run db:seed -w apps/mobile

      - name: Tests (core + domain + stats + voice + security)
        run: npm run test -w apps/mobile

      - name: Build
        run: npm run build -w apps/mobile
