name: CI

# Gates del monorepo. PostgreSQL efímero coincide con el schema de apps/mobile.
# El workflow valida tipos, lint, migraciones, seed, tests y builds antes de integrar cambios.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-only-insecure-32chars-minimum

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install raíz (lock reproducible)
        run: npm ci

      - name: Install web (lock independiente)
        run: npm ci --prefix apps/web

      - name: Typecheck mobile
        run: npm run typecheck -w apps/mobile

      - name: Lint mobile
        run: npm run lint -w apps/mobile

      - name: Typecheck web
        run: npm run typecheck --prefix apps/web

      - name: Lint web
        run: npm run lint --prefix apps/web

      - name: Migrate + seed
        run: |
          npx prisma migrate deploy --schema apps/mobile/prisma/schema.prisma
          npm run db:seed -w apps/mobile

      - name: Tests mobile
        run: npm run test -w apps/mobile

      - name: Build mobile
        run: npm run build -w apps/mobile

      - name: Build web
        run: npm run build --prefix apps/web
