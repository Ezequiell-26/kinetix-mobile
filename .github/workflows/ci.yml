name: CI

# Gates del monorepo. apps/mobile usa el lock raíz; apps/web conserva su
# lock independiente para no mezclar dos árboles de dependencias de Next/React.
# PostgreSQL efímero es la base de CI y coincide con el schema PostgreSQL.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-only-insecure-32chars-minimum

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install raíz (lock reproducible)
        run: npm ci

      - name: Install web (lock independiente)
        run: npm ci --prefix apps/web

      - name: Typecheck mobile
        run: npm run typecheck -w apps/mobile

      - name: Esperar Postgres efímero
        run: |
          for i in $(seq 1 30); do
            if echo "SELECT 1;" | npx prisma db execute --stdin --schema apps/mobile/prisma/schema.prisma >/dev/null 2>&1; then
              echo "Postgres listo"
              exit 0
            fi
            sleep 3
          done
          echo "Postgres no respondió a tiempo"
          exit 1

      - name: Migrate + seed
        run: |
          npx prisma migrate deploy --schema apps/mobile/prisma/schema.prisma
          npm run db:seed -w apps/mobile

      - name: Tests mobile
        run: npm run test -w apps/mobile

      - name: Build mobile
        run: npm run build -w apps/mobile

      - name: Build web
        run: npm run build --prefix apps/web
