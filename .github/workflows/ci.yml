name: CI

# Gate anti-ruptura (V8 §80 + PARALLEL_PROTOCOL §4).
# Ningún PR a develop/main se fusiona en rojo.
# NOTA: no hay job de lint porque apps/mobile no tiene config de ESLint
# (Next 15 lo pediría interactivo). `next build` ya valida tipos+compilación.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck (0 errores)
        run: npm run typecheck

      - name: Migrate + seed (DB efímera de CI)
        env:
          DATABASE_URL: file:./dev.db
          JWT_SECRET: ci-only-insecure-32chars-minimum
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Tests
        env:
          DATABASE_URL: file:./dev.db
          JWT_SECRET: ci-only-insecure-32chars-minimum
        run: npm run test

      - name: Build
        env:
          DATABASE_URL: file:./dev.db
          JWT_SECRET: ci-only-insecure-32chars-minimum
        run: npm run build
