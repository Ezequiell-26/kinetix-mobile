<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión - KinetixFit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #10b981, #14b8a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }
    button {
      background: linear-gradient(135deg, #10b981, #14b8a6);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
    }
    .cached-pages {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
    }
    .cached-pages h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #10b981;
    }
    .cached-pages ul {
      list-style: none;
      text-align: left;
    }
    .cached-pages li {
      padding: 0.5rem 0;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cached-pages li:last-child {
      border-bottom: none;
    }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    .status-indicator.online {
      background: #10b981;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1><span class="status-indicator" id="statusDot"></span>Sin Conexión</h1>
    <p>Parece que estás offline. No te preocupes, algunas funciones siguen disponibles sin conexión.</p>
    <button onclick="window.location.reload()">Reintentar Conexión</button>
    
    <div class="cached-pages">
      <h3>Disponible Offline:</h3>
      <ul>
        <li>✓ Dashboard principal</li>
        <li>✓ Historial de entrenamientos</li>
        <li>✓ Rutinas guardadas</li>
        <li>✓ Estadísticas personales</li>
        <li>✓ Configuración de perfil</li>
      </ul>
    </div>
  </div>

  <script>
    // Monitorear estado de conexión
    function updateStatus() {
      const dot = document.getElementById('statusDot');
      if (navigator.onLine) {
        dot.classList.add('online');
        setTimeout(() => window.location.reload(), 1000);
      } else {
        dot.classList.remove('online');
      }
    }

    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
